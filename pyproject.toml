[project]
name = "safesplit-distributed-dl"
version = "0.1.0"
description = "SafeSplit split-learning backdoor defense reproduction"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "torch>=2.2",
  "torchvision>=0.17",
  "ipython>=8.0",
]

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.uv]
package = false
